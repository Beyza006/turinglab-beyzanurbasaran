name: "binary_compare"
description: >
  Iki canonical binary sayinin karsilastirilmasi: 'x#y' icin x > y mi?
  Sinirsiz uzunluk desteklenir, herhangi bir bit sayisi icin calisir.
  Iki fazli algoritma:
    Faz 1 (uzunluk esleme): x'in MSB'sini P/Q (P=0, Q=1) ile,
      y'nin MSB'sini R/S (R=0, S=1) ile esleyerek isaretle.
      - Bir tarafta isaretsiz bit kalmaz ama digerinde 0/1 varsa,
        o taraf canonical olarak buyuktur.
      - Ikisi de ayni anda biterse uzunluklar esit -> Faz 2.
    Faz 2 (MSB-first bit-bit): Faz 1'in marker'lari bit degerlerini
      sakladigi icin, soldan saga P/Q-R/S ciftlerini karsilastir.
      Ilk farklilasan bitte: 1 vs 0 -> kabul; 0 vs 1 -> ret;
      tum bitler esitse -> ret.
  Sembol ayrimi:
    '0','1','#' = orijinal girdi
    P,Q = x'in Faz 1'de isaretlenmis biti (P=0, Q=1)
    R,S = y'nin Faz 1'de isaretlenmis biti (R=0, S=1)
    X   = Faz 2'de tuketilmis marker

states:
  - q_p1_seek_x
  - q_p1_seek_hash
  - q_p1_seek_y
  - q_p1_x_done
  - q_return_to_p1
  - q_return_to_p2
  - q_p2_seek_x
  - q_p2_x_was_0
  - q_p2_x_was_1
  - q_p2_seek_y_for_0
  - q_p2_seek_y_for_1
  - q_accept
  - q_reject

input_alphabet: ["0", "1", "#"]
tape_alphabet: ["0", "1", "#", "B", "P", "Q", "R", "S", "X"]
blank: "B"
start_state: q_p1_seek_x
accept_states: [q_accept]
reject_states: [q_reject]

transitions:
  # ===================================================
  # FAZ 1: Uzunluk esleme (her iterasyonda bir cift)
  # ===================================================

  # q_p1_seek_x: x bolgesinde en soldaki isaretsiz biti bul
  - {state: q_p1_seek_x, read: "P", next: q_p1_seek_x, write: "P", move: R}
  - {state: q_p1_seek_x, read: "Q", next: q_p1_seek_x, write: "Q", move: R}
  - {state: q_p1_seek_x, read: "0", next: q_p1_seek_hash, write: "P", move: R}
  - {state: q_p1_seek_x, read: "1", next: q_p1_seek_hash, write: "Q", move: R}
  - {state: q_p1_seek_x, read: "#", next: q_p1_x_done, write: "#", move: R}

  # q_p1_seek_hash: x'i isaretledikten sonra '#'i bul
  - {state: q_p1_seek_hash, read: "0", next: q_p1_seek_hash, write: "0", move: R}
  - {state: q_p1_seek_hash, read: "1", next: q_p1_seek_hash, write: "1", move: R}
  - {state: q_p1_seek_hash, read: "P", next: q_p1_seek_hash, write: "P", move: R}
  - {state: q_p1_seek_hash, read: "Q", next: q_p1_seek_hash, write: "Q", move: R}
  - {state: q_p1_seek_hash, read: "#", next: q_p1_seek_y, write: "#", move: R}

  # q_p1_seek_y: y bolgesinde en soldaki isaretsiz biti bul ve isaretle
  - {state: q_p1_seek_y, read: "R", next: q_p1_seek_y, write: "R", move: R}
  - {state: q_p1_seek_y, read: "S", next: q_p1_seek_y, write: "S", move: R}
  - {state: q_p1_seek_y, read: "0", next: q_return_to_p1, write: "R", move: L}
  - {state: q_p1_seek_y, read: "1", next: q_return_to_p1, write: "S", move: L}
  # y bitti ama x'te bit vardi -> x daha uzun (canonical) -> kabul
  - {state: q_p1_seek_y, read: "B", next: q_accept, write: "B", move: L}

  # q_p1_x_done: x'te isaretsiz bit kalmadi; y'de var mi?
  - {state: q_p1_x_done, read: "R", next: q_p1_x_done, write: "R", move: R}
  - {state: q_p1_x_done, read: "S", next: q_p1_x_done, write: "S", move: R}
  # y'de isaretsiz bit var -> y daha uzun -> ret
  - {state: q_p1_x_done, read: "0", next: q_reject, write: "0", move: R}
  - {state: q_p1_x_done, read: "1", next: q_reject, write: "1", move: R}
  # y de bitti, uzunluklar esit -> Faz 2
  - {state: q_p1_x_done, read: "B", next: q_return_to_p2, write: "B", move: L}

  # q_return_to_p1: en sola don, Faz 1 devam
  - {state: q_return_to_p1, read: "P", next: q_return_to_p1, write: "P", move: L}
  - {state: q_return_to_p1, read: "Q", next: q_return_to_p1, write: "Q", move: L}
  - {state: q_return_to_p1, read: "R", next: q_return_to_p1, write: "R", move: L}
  - {state: q_return_to_p1, read: "S", next: q_return_to_p1, write: "S", move: L}
  - {state: q_return_to_p1, read: "0", next: q_return_to_p1, write: "0", move: L}
  - {state: q_return_to_p1, read: "1", next: q_return_to_p1, write: "1", move: L}
  - {state: q_return_to_p1, read: "#", next: q_return_to_p1, write: "#", move: L}
  - {state: q_return_to_p1, read: "B", next: q_p1_seek_x, write: "B", move: R}

  # q_return_to_p2: en sola don, Faz 2'ye gec
  - {state: q_return_to_p2, read: "P", next: q_return_to_p2, write: "P", move: L}
  - {state: q_return_to_p2, read: "Q", next: q_return_to_p2, write: "Q", move: L}
  - {state: q_return_to_p2, read: "R", next: q_return_to_p2, write: "R", move: L}
  - {state: q_return_to_p2, read: "S", next: q_return_to_p2, write: "S", move: L}
  - {state: q_return_to_p2, read: "X", next: q_return_to_p2, write: "X", move: L}
  - {state: q_return_to_p2, read: "#", next: q_return_to_p2, write: "#", move: L}
  - {state: q_return_to_p2, read: "B", next: q_p2_seek_x, write: "B", move: R}

  # ===================================================
  # FAZ 2: MSB-first bit-bit karsilastirma
  # ===================================================

  # q_p2_seek_x: x bolgesinde en soldaki P/Q'yu bul
  - {state: q_p2_seek_x, read: "X", next: q_p2_seek_x, write: "X", move: R}
  - {state: q_p2_seek_x, read: "P", next: q_p2_x_was_0, write: "X", move: R}
  - {state: q_p2_seek_x, read: "Q", next: q_p2_x_was_1, write: "X", move: R}
  # x'in tum bitleri tuketildi -> sayilar esit -> ret
  - {state: q_p2_seek_x, read: "#", next: q_reject, write: "#", move: R}

  # q_p2_x_was_0 / q_p2_x_was_1: '#'i bul, sonra y'yi ara
  - {state: q_p2_x_was_0, read: "P", next: q_p2_x_was_0, write: "P", move: R}
  - {state: q_p2_x_was_0, read: "Q", next: q_p2_x_was_0, write: "Q", move: R}
  - {state: q_p2_x_was_0, read: "X", next: q_p2_x_was_0, write: "X", move: R}
  - {state: q_p2_x_was_0, read: "#", next: q_p2_seek_y_for_0, write: "#", move: R}

  - {state: q_p2_x_was_1, read: "P", next: q_p2_x_was_1, write: "P", move: R}
  - {state: q_p2_x_was_1, read: "Q", next: q_p2_x_was_1, write: "Q", move: R}
  - {state: q_p2_x_was_1, read: "X", next: q_p2_x_was_1, write: "X", move: R}
  - {state: q_p2_x_was_1, read: "#", next: q_p2_seek_y_for_1, write: "#", move: R}

  # q_p2_seek_y_for_0: x=0; y'nin en soldaki R/S'sini bul
  - {state: q_p2_seek_y_for_0, read: "X", next: q_p2_seek_y_for_0, write: "X", move: R}
  # 0 vs 0: esit, devam
  - {state: q_p2_seek_y_for_0, read: "R", next: q_return_to_p2, write: "X", move: L}
  # 0 vs 1: y > x -> ret
  - {state: q_p2_seek_y_for_0, read: "S", next: q_reject, write: "S", move: L}

  # q_p2_seek_y_for_1: x=1; y'nin en soldaki R/S'sini bul
  - {state: q_p2_seek_y_for_1, read: "X", next: q_p2_seek_y_for_1, write: "X", move: R}
  # 1 vs 0: x > y -> kabul
  - {state: q_p2_seek_y_for_1, read: "R", next: q_accept, write: "R", move: L}
  # 1 vs 1: esit, devam
  - {state: q_p2_seek_y_for_1, read: "S", next: q_return_to_p2, write: "X", move: L}
