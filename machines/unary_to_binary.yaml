name: "unary_to_binary"
description: >
  Unary girdiyi binary'e cevirir. Sinirsiz uzunluk: her unary '1' icin
  negatif sutunlarda tutulan binary sayaci 1 artirir.
  Strateji:
    - Faz 1 (q_convert): tum input '1'lerini 'I' yap, sona '#' koy.
    - Faz 2 (q_init_binary): sola yuru, pozisyon -1'e '0' yaz (baslangic binary).
    - Faz 3 (iteratif): en sagdaki isaretsiz I'yi bul (q_find_hash -> q_seek_I),
      X yap, sola don, LSB'de increment uygula (carry sola yayilir).
    - Faz 4 (q_cleanup): I/X/# kalintilarini B yap; geriye sadece binary kalir.
  Sembol ayrimi:
    '0','1' = binary basamak (negatif pozisyonlar)
    'I'     = isaretsiz unary (input '1'inin donusumu)
    'X'     = islenmis unary
    '#'     = input bolgesinin sag siniri

states:
  - q_start
  - q_convert
  - q_init_binary
  - q_find_hash
  - q_seek_I
  - q_back_to_binary
  - q_carry
  - q_cleanup
  - q_accept

input_alphabet: ["1"]
tape_alphabet: ["0", "1", "B", "I", "X", "#"]
blank: "B"
start_state: q_start
accept_states: [q_accept]
reject_states: []

transitions:
  # --- q_start: bos girdi veya ilk '1' ---
  - {state: q_start, read: "B", next: q_accept, write: "0", move: R}   # bos -> "0"
  - {state: q_start, read: "1", next: q_convert, write: "I", move: R}

  # --- q_convert: kalan input '1'lerini 'I'ye cevir, sona '#' yaz ---
  - {state: q_convert, read: "1", next: q_convert, write: "I", move: R}
  - {state: q_convert, read: "B", next: q_init_binary, write: "#", move: L}

  # --- q_init_binary: sola yuru, pozisyon -1'e baslangic '0' yaz ---
  - {state: q_init_binary, read: "I", next: q_init_binary, write: "I", move: L}
  - {state: q_init_binary, read: "B", next: q_find_hash, write: "0", move: R}

  # --- q_find_hash: sag yone '#'i bul (binary ve input bolgelerinden gec) ---
  - {state: q_find_hash, read: "0", next: q_find_hash, write: "0", move: R}
  - {state: q_find_hash, read: "1", next: q_find_hash, write: "1", move: R}
  - {state: q_find_hash, read: "I", next: q_find_hash, write: "I", move: R}
  - {state: q_find_hash, read: "X", next: q_find_hash, write: "X", move: R}
  - {state: q_find_hash, read: "#", next: q_seek_I, write: "#", move: L}

  # --- q_seek_I: '#'ten sola yuruyerek en sagdaki I'yi bul ve X yap ---
  - {state: q_seek_I, read: "X", next: q_seek_I, write: "X", move: L}
  - {state: q_seek_I, read: "I", next: q_back_to_binary, write: "X", move: L}
  # Eger binary digite varirsak (I kalmadi) -> temizlik
  - {state: q_seek_I, read: "0", next: q_cleanup, write: "0", move: R}
  - {state: q_seek_I, read: "1", next: q_cleanup, write: "1", move: R}

  # --- q_back_to_binary: I'lerden sola gec, LSB'ye var ---
  - {state: q_back_to_binary, read: "I", next: q_back_to_binary, write: "I", move: L}
  # LSB'de increment
  - {state: q_back_to_binary, read: "0", next: q_find_hash, write: "1", move: R}
  - {state: q_back_to_binary, read: "1", next: q_carry, write: "0", move: L}

  # --- q_carry: carry'yi sola yay; gerekirse yeni MSB ekle ---
  - {state: q_carry, read: "0", next: q_find_hash, write: "1", move: R}
  - {state: q_carry, read: "1", next: q_carry, write: "0", move: L}
  - {state: q_carry, read: "B", next: q_find_hash, write: "1", move: R}   # yeni MSB

  # --- q_cleanup: X'leri ve '#'i B yap, geriye sadece binary kalsin ---
  - {state: q_cleanup, read: "X", next: q_cleanup, write: "B", move: R}
  - {state: q_cleanup, read: "#", next: q_accept, write: "B", move: R}
