name: "unary_increment"
description: "Tekli (unary) sayıyı bir artırır. Girdi: 111 (=3) -> 1111 (=4)"

states: [q0, q_accept]
input_alphabet: ["1"]
tape_alphabet: ["1", "B"]
blank: "B"
start_state: q0
accept_states: [q_accept]
reject_states: []

transitions:
  # Sağa doğru git
  - {state: q0, read: "1", next: q0,        write: "1", move: R}
  # Sona ulaşınca bir '1' ekle ve kabul et
  - {state: q0, read: "B", next: q_accept,  write: "1", move: R}
